[project]
name = "retail-intelligence-platform"
version = "1.0.0"
description = "Warehouse, analytics, forecasting, inventory and recommendations on the UCI Online Retail II data"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # SQL strings and test tables read better unwrapped
